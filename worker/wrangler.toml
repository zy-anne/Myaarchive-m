name = "myaarchive-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
TURSO_DB_URL = "libsql://myaarchive-maomao.aws-ap-northeast-1.turso.io"

# Cloudflare R2 bucket binding for assets (covers, avatars, gallery)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "myaarchive-assets"

# Required production secrets (set via `wrangler secret put <KEY>`):
# 1. TURSO_AUTH_TOKEN (Turso database auth JWT)
# 2. JWT_SECRET (Secret key for minting and verifying app session JWTs)
