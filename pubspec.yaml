name: myaarchive_mobile
description: "Myaarchive — Personal reading library & manga/book tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking (Turso HTTP + R2 S3)
  dio: ^5.7.0
  crypto: ^3.0.6

  # Auth
  bcrypt: ^1.1.3

  # Local caching
  shared_preferences: ^2.5.2
  path_provider: ^2.1.5

  # Image handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # UI utilities
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.1
  uuid: ^4.5.1
  intl: ^0.20.2
  flutter_staggered_grid_view: ^0.7.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
